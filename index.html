<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Lootlings — skattjakt för barn</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/inv.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Lootlings</h1>
      <div class="stats">
        <span id="meta">Välj en hjälte</span>
        <span id="hero-stats"></span>
        <button type="button" id="inv-btn" class="inv-open">Väska</button>
      </div>
    </header>
    <div id="stage-wrap">
      <canvas id="game"></canvas>
      <div id="toast" class="hidden"></div>
      <div id="hud-right">
        <div id="gear"></div>
        <div id="log"></div>
      </div>
      <div id="touch" class="hidden">
        <div class="stick" id="stick"><div class="stick-knob" id="knob"></div></div>
        <button class="atk" id="atk-btn" type="button">A</button>
        <button class="skl" id="skl-btn" type="button">B</button>
        <button class="invt" id="inv-touch" type="button">I</button>
      </div>
      <div id="d2hud">
        <div class="orb life">
          <div class="orb-glass"></div>
          <div class="orb-fill" id="hp-fill"></div>
          <span id="hp-txt">0/0</span>
        </div>
        <div class="xp-wrap">
          <div class="xp-fill" id="xp-fill"></div>
          <span id="xp-txt">XP</span>
        </div>
        <div class="orb mana">
          <div class="orb-glass"></div>
          <div class="orb-fill" id="mp-fill"></div>
          <span id="mp-txt">0/0</span>
        </div>
      </div>
      <div class="overlay" id="overlay">
        <div id="build-ver"></div>
        <div class="card">
          <h2>Välj din hjälte</h2>
          <p>Gå ner i grottan. Välj en kraft med skillpoint. I öppnar väskan. WASD + håll attack. E / 1 2 3 är krafter.</p>
          <div class="classes" id="class-picks"></div>
        </div>
      </div>
      <div class="overlay hidden" id="inv-overlay">
        <div class="card inv-card">
          <h2>Väska</h2>
          <p>Klicka en sak i väskan för att ta på den. I / Tab stänger.</p>
          <div id="inv-equip"></div>
          <h3>Ryggsäck</h3>
          <div id="inv-bag"></div>
          <button class="ghost" id="inv-close" type="button">Stäng</button>
        </div>
      </div>
      <div class="overlay hidden" id="dead-overlay">
        <div class="card">
          <h2>Aj då!</h2>
          <p id="dead-text"></p>
          <button class="primary" id="again" type="button">Ny runda</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
